version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: o365_user
      POSTGRES_PASSWORD: o365_password
      POSTGRES_DB: o365_monitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U o365_user -d o365_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'status.*green\\|yellow'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kibana (optional - for analytics)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # Kafka (using KRaft mode - no Zookeeper needed)
  kafka:
    image: bitnami/kafka:3.6
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend API (optional - can run locally for development)
  # api:
  #   build: .
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - DATABASE_URL=host=postgres user=o365_user password=o365_password dbname=o365_monitor port=5432 sslmode=disable
  #     - ELASTICSEARCH_URL=http://elasticsearch:9200
  #     - KAFKA_BROKERS=kafka:9092
  #     - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
  #     - CLERK_FRONTEND_API=${CLERK_FRONTEND_API}
  #     - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5174
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     elasticsearch:
  #       condition: service_healthy
  #     kafka:
  #       condition: service_healthy

volumes:
  postgres_data:
  elasticsearch_data:
  kafka_data:
