# Lightweight MicroSeem stack for the ClickHouse-first hot path.
#
# Usage:
#   docker compose -f docker-compose.light.yml up -d --build
#
# This stack removes Elasticsearch, Kibana, and Kafka from the minimum runtime.
# Logs are published to NATS JetStream and mirrored into ClickHouse for the
# current API query path.

services:
  # ===================
  # Frontend (React)
  # ===================
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
        VITE_KIBANA_URL: ${VITE_KIBANA_URL:-}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - microseem

  # ===================
  # Backend API (Go)
  # ===================
  api:
    build: .
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=host=postgres user=${POSTGRES_USER:-microseem} password=${POSTGRES_PASSWORD:-microseem_secret} dbname=${POSTGRES_DB:-microseem} port=5432 sslmode=disable
      - MICROSEEM_LOG_STORE=clickhouse
      - MICROSEEM_EVENT_BUS=nats
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=${NATS_STREAM:-MICROSEEM_LOGS}
      - NATS_SUBJECT=${NATS_SUBJECT:-logs.raw}
      - NATS_MAX_AGE_HOURS=${NATS_MAX_AGE_HOURS:-168}
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-microseem}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - GEOIP_DB_PATH=/app/GeoLite2-City.mmdb
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - microseem

  # ===================
  # PostgreSQL Database
  # ===================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-microseem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-microseem_secret}
      POSTGRES_DB: ${POSTGRES_DB:-microseem}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-microseem} -d ${POSTGRES_DB:-microseem}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - microseem

  # ===================
  # ClickHouse Hot Log Store
  # ===================
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-microseem}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - microseem

  # ===================
  # NATS JetStream Event Bus
  # ===================
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - microseem

networks:
  microseem:
    driver: bridge

volumes:
  postgres_data:
  clickhouse_data:
  nats_data:
